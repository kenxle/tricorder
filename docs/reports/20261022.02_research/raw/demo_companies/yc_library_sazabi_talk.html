<link rel="stylesheet" crossorigin="" href="https://bookface-static.ycombinator.com/vite/assets/PartnersPage-ChhbFxOI.css" media="screen" nonce="n6KQa8Ltj7ltvtlsy2g5gQ==" />
<link rel="stylesheet" crossorigin="" href="https://bookface-static.ycombinator.com/vite/assets/ApplyToYCPage-y3ZQ-TZC.css" media="screen" nonce="n6KQa8Ltj7ltvtlsy2g5gQ==" /><script src="https://bookface-static.ycombinator.com/assets/blog-54db898b518e809d1aaeaacf7e7cc20fa35375fb3348fc2b56cea781f5cdfa55.js" defer="defer" nonce="n6KQa8Ltj7ltvtlsy2g5gQ=="></script><link href="https://www.ycombinator.com/library/bp-the-end-of-manual-debugging" rel="canonical" /><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/css/all.min.css" rel="stylesheet" /></head><body class="ycdc2 articles show"><div data-page="{&quot;component&quot;:&quot;ArticlesLibraryShowPage&quot;,&quot;props&quot;:{&quot;article&quot;:{&quot;id&quot;:2345,&quot;slug&quot;:&quot;bp-the-end-of-manual-debugging&quot;,&quot;title&quot;:&quot;The End of Manual Debugging&quot;,&quot;content&quot;:&quot;In this episode of Founder Firesides, YC General Partner Aaron Epstein talks to Sherwood Callaway, founder of Sazabi (P26), who exited his first YC company and is coming back through YC for a second time. Sazabi is an AI-native observability platform that replaces tools like Datadog, letting engineers ask plain-English questions about their production systems instead of digging through dashboards. They discuss why logs are the only telemetry you need, lessons from building a company that didn&#39;t play to his strengths, and why maintaining software is AI&#39;s biggest untapped opportunity.\n&quot;,&quot;ranking&quot;:823,&quot;root_id&quot;:176,&quot;author&quot;:&quot;Y Combinator&quot;,&quot;authors&quot;:[],&quot;description&quot;:&quot;YC&#39;s Aaron Epstein talks to Sherwood Callaway, founder of Sazabi (P26), about building an AI-native observability platform that replaces tools like Datadog with plain-English queries. They discuss why logs are the only telemetry you need, lessons from a prior YC exit, and why maintaining software is AI&#39;s biggest untapped opportunity.&quot;,&quot;sus_curriculum&quot;:false,&quot;link&quot;:&quot;https://youtu.be/UGYnC9zqa-k&quot;,&quot;transcript&quot;:&quot;Host: I am excited to welcome Sherwood from Sasabi, who has exited his first YC company and is coming back through the YC batch again for a second time. Sherwood, thanks so much for joining.\n\nSherwood: Yeah, really excited to participate in the upcoming YC batch, be back here for a second time. I think it&#39;s gonna be a really different experience. And to uh introduce Sasabi to the batch and to into the world. Yeah,\n\nHost: amazing. So uh maybe to start off, um tell us a little bit about what Sasabi does.\n\nSherwood: Sasabi is an AI-native observability platform. It&#39;s specifically designed for uh fast-moving engineering teams. Um one way to think about it is like it&#39;s like a data dog or a Sentry, but instead of being built in 2010 or 2012, it&#39;s built to 2026. And it&#39;s aggressively AI native or uses a lot of AI agents. Um and the idea basically came from this uh experience I&#39;ve had uh over the course of my engineering career where Every time there&#39;s an outage in production, every time there&#39;s a bug, I would spend hours digging through dashboards and log searches and looking at flame graphs and kind of not really knowing what&#39;s going on. And eventually I might get to the root cause, maybe not. Uh I felt like AI coding tools had gotten very powerful and the the part of my job that involved creating new software was was uh really changing, but the part of my uh job that involved maintaining existing software wasn&#39;t really changing. With Sasabi, customers can basically ask questions about how their production system is doing. They can ask things like why is production down, or what does this error mean, or which customers are affected, or which commit is responsible. And it makes it very easy to find and fix production issues.\n\nHost: Amazing. And you you kind of have a controversial take on this and how you&#39;re building it, that it&#39;s just built off of the log files, right? Tell us a little bit more about that.\n\nSherwood: Yes. So one of the things that we say at Sasabi is logs are all you need. And it&#39;s actually one of three different uh sort of hot takes that we have. We call them our core principles. They&#39;re a part of uh our manifesto, which we we published. Logs are all you need specifically refers to this idea that we think you only need logs, like only need this specific type of telemetry uh to do observability well. Um and that&#39;s controversial because in the past, for a long time, uh people would say that you need something called the three pillars of observability. You need logs, metrics, and traces. And uh that&#39;s because like these different data types serve different types of queries. And the some data types are are large and some data some data types are small. And so for different types of things you you you end up using these different kinds of data. But the result is that you have three different things that you need to instrument. So for every engineering team out there, they need to implement uh logs, metrics, and traces for all of their services. That&#39;s a huge pain in the butt. Uh logs relative to metrics and traces are so much easier to use. Like every developer knows how to do a print statement, and every developer knows how to read a log stream. And so we think that uh logs kind of represent the Occam&#39;s razor of observability. Like it&#39;s anyone can do it. Like it&#39;s the simplest possible way of doing it. Then there&#39;s another thing which makes this true, uh, which is this AI paradigm shift. So in the past, logs were kind of the least valuable type of telemetry because they&#39;re mostly unstructured unstructured. Um that&#39;s that refers to the fact that like the log line contains like natural language in it, and uh you can&#39;t like have a machine read over it and derive a lot of insight. Well, obviously AI changes what&#39;s possible there, and uh you can now have AI agents read all of your log lines and Tell you what&#39;s going on. So that&#39;s the idea behind logs are all you need.\n\nHost: Very cool. And obviously observability is changing a lot over the last couple of decades. But um talk about how you got your start early on uh setting up observability at Brex.\n\nSherwood: Yeah, so I started my career as a front-end engineer, but I was like the junior most front-end engineer at Crunch Base originally. And um because you&#39;re junior, like you don&#39;t get to work on any of the important stuff. So my team was complaining about CI C D and about how long their builds and deploys would take. So I went down this rabbit hole, which is CI C D and figured out how to make our deploys faster. Uh and That led me to infrastructure in DevOps, and which turned out to be something that was uh really fascinating for me. I got basically obsessed with this problem of like how do we make production reliable and how do we make developers more productive and allow them to ship faster and to ship higher quality code. So I was already kind of primed and interested in that space, and then I went to join Brex, where I was lucky to be basically the third infrastructure engineer at Brex. Um I think it was roughly employee 70. And they had just stood up what what they call their foundation team. My the second infrastructure engineer, I think, had joined the same week. So I can&#39;t quite call myself the second, but like really close. Uh and actually he works at Sasabi today, which is great. While I was at Brex, first we built out uh all of Brex&#39;s infrastructure that supported the company through Hypergrowth. So all of our uh staging and and production environments, the microservice framework, CS CD system. Eventually when we had rolled out like a lot of this basic infrastructure in the foundation team had grown a lot. We were in this position where we were starting to splinter the foundation team into different sub-teams and focus on different specializations. And we had found ourselves in a position where we had like fifty different microservices running in Kubernetes as a part of our production cluster, and they were all owned by different teams, and some teams would own multiple microservices, and it was getting hard to kind of know what was going on in production. The answer I didn&#39;t know at the time because I was too junior, but the answer is observability. Like this is the reason that observability exists is to help uh developers or engineering teams ask questions about uh their production systems. And so I was fortunate to be one of the team members that helped start the observability team at Brex. Uh and then while working on on observability at Brex, I became very observability pilled.\n\nSherwood: basically like the observability philosophy is that you can you can have uh integration tests, you can have unit tests, you can have QA processes, you can have like release processes, you can do everything you want, like static analysis before the code s goes to production to try to make sure that it&#39;s right and that it&#39;s gonna uh behave well. But like nothing really prepares you for production. It it sort of reminds me of that um that Mike Tyson quote where he&#39;s like, you know, everyone&#39;s got a plan until they get punched in the face. That&#39;s so true of of shipping software. So once you&#39;re in a production, you just can&#39;t predict what&#39;s gonna happen. You can only prepare yourself to respond. Uh and that&#39;s what observability\n\nHost: is. And how long did you spend uh building that out at Brex?\n\nSherwood: I worked on observability at Brex for about a year. Uh in total I worked at Brex for about two and a half years. The main things that we did while we were on that observability team was setting up auto instrumentation. So all of every microservice that gets created uh automatically receives a bunch of metrics and traces and longs. um installing all the infrastructure that&#39;s responsible for capturing and forwarding that information to our observability systems, setting up tools like Datadog and configuring them. Like I went, uh I mean Datadog is like hundreds of modules, but I feel like I&#39;ve explored every single one. And every knob and configuration option and and tuned it appropriately for for the team at Brex. Uh and then now have done that at a couple different companies. Um and other things like making sure that every service has uh like a dashboard that covers all of the key metrics and um and basic monitors. Yeah. And driving uh SLO and SLI adoption, which is a little bit um more that&#39;s uh some observability lingo that is more common in the the enterprise and SRE space, but basically uh making sure that every team knows how to use observability tools and is measuring their services.\n\nHost: And talk about your decision to ultimately leave Brex and start your own company.\n\nSherwood: Yeah, honestly I feel like I&#39;d been latent for a long time. Yeah, like I started my career as a uh through a web development boot camp and uh that boot camp was here in San Francisco. I grew up in North Carolina, so pretty far cry from like Silicon Valley startup tech culture. And while I was at this boot camp, everyone I knew was reading Acronews and uh wanted to work at the hot YC startup. It was like Stripe and Gusto and uh Instacart at the time. Uh and It was just an amazing experience for me and it it it made me really want to work in startups and specifically to do my own YC venture-backed tech startup. So from the very beginning of my career, like that had been my long-term goal. While I was working at Brex in I was living in New York with my roommate uh who was also an early Brex team member, he and I had relocated to New York together with Brex from San Francisco to help start this New York office. But the the pandemic happened and so we got stuck in New York with like a two year lease. And of course, like what do you what do two like software engineers do like when they have a lot of free time and nothing going on? So we started to talk about startup ideas and felt that we had a really special team and wanted to do something together and uh applied for YC and that was uh I guess the rest is history. Yeah.\n\nHost: Um talk a little bit about how you came up with the idea that you originally applied with.\n\nSherwood: My first company was called Opkit. We went through YC Summer 21 and which was w one of the COVID badges. And what Opkit was was a voice AI for a healthcare company. So we build LLM-based voice agents to automate calls to insurance companies for things like uh uh eligibility, which is basically when the the provider to tries to determine whether you have coverage or not for your your procedure, and for uh uh prior authorization, which is another hoop that insurance companies make you jump through to get certain procedures, uh, and also uh to do uh claim to check on the status of of claims that have been submitted. Um It&#39;s a pretty esoteric field. It was a very big big field, but in a far cry from anything I had done previous. Yeah. Why\n\nHost: did you decide to work on that?\n\nSherwood: Yeah, it&#39;s I was well, I guess to start with, my my dad was a doctor growing up. Um so I had a little bit of a lens of like, you know, if if I know if what I know is like just software engineering and tech startups and, you know, I need to have an idea that&#39;s like out in the real world, right? Like then. That impacts real businesses, not like just tech businesses. So the only field that I really knew anything about outside of um uh technology was was healthcare. And I felt like I had access to my dad, who&#39;s a subject matter expert, and to his practice and his uh his colleagues, and I could go interview the the staff and the administrators there. Um so It felt like an opening and uh meanwhile like I was coming from a lens of w having worked at Brex and having been very interested in fintech during fintech&#39;s like real rise from like during the second half of the twenty tens. And uh was thinking about like what&#39;s next for fintech. You know, it&#39;s seems like we&#39;ve done a lot of c like consumer fintech and now we have like the Brexit of the world, the Brexites and the Mercurys. uh maybe verticalized fintech would be what&#39;s next. And so I thought, why not? Like healthcare seems like a big vertical. Like there&#39;s a lot of money moving there. Um and in retrospect I think uh Opkit was kind of like an MBA case study approach to to picking a company or picking an idea. It wasn&#39;t based on personal experience or insight or uh like or passion, candidly. It was based on this um this real desire to start something and uh and you know, grasping basically for for whatever I think I th wherever there was an opportunity. Yeah.\n\nHost: Did you ever consider moving outside of healthcare or for you know the light you spent years working on Opkit? Yeah, yeah. W was it always like this is a healthcare company and we must stay within healthcare?\n\nSherwood: Yeah, we you know, I regret not evaluating that like f fundamental condition more carefully. Um I mean actually I don&#39;t have a ton of regrets because I am here where I am today and like all those there were a lot of hard lessons learned from Opkit, but now Sasabi gets the benefit from all of them. But We went in like with a healthcare idea and I you know, my co my co-founder Justin and I love working together and we&#39;re felt like we were learning a lot and making some progress. Slow slow and steady progress um and peeling back layers of the healthcare ecosystem and learning about new problems within the space. So\n\nHost: Yeah. Yeah, we tend to see that a lot. People that have a lot of experience in an area, for you is, you know, observability and even in fintech, you probably had a lot of fintech experience. much more than than other uh people would. Yeah. And then explicitly saying, I don&#39;t wanna do that because I either I know too much about it, so I know, you know, all the problems or what&#39;s gonna be difficult about it, um, or I&#39;m kinda burned out on it. Yeah. And so I&#39;m gonna go and do something that I&#39;ve never done before and I don&#39;t have the the depth of experience or insights on. Was there a moment when you were building Opkit Maybe in hindsight, looking back where you&#39;re like, I should have known at this moment that this was not the right thing for us.\n\nSherwood: I think was funny, it was like we were definitely not the right team to start a healthcare fintech company or a healthcare AI company when we started. But Progressively we became that team. Mm-hmm. So ironically, like if I had if I if Sasabi were uh a different kind of company, it could be a healthcare or a health tech company. Because we have now four years of hard-earned experience in that space. And at some point it was like, oh, we&#39;ve got one year of experience in this space, and we like know more than anyone we talk to. Um and I guess this is the definition of the sunk cost fallacy. But uh There were there were times when we especially during YC, which was at the very beginning of our company, uh, which really kind of like kicked us out of the out of the nest so to some extent, um, where we evaluated it. But we I don&#39;t think we went deep enough about that or really reckoned with like what it would look like for us to spend the next ten years of our life working on a healthcare or health tech company. Um yeah, we should have thought harder about that. Yeah.\n\nHost: Well it&#39;s like the curse of the second time founder a lot of times is coming up with the idea to work on because you know too much. And One of I mean you&#39;re describing naivete of jumping into this space that you knew nothing about and trying to learn as quickly as you can, but sometimes that&#39;s what&#39;s needed too, just to be able to\n\nSherwood: Yeah, I I think that&#39;s true. I mean I think that if you&#39;re especially if you&#39;re like a real young person and you already you want to get started, you like You can be an expert at anything, but you have to be prepared to put a couple of years of experience in, um, to to learn the ropes, to ramp up, to build a network, um, to gain trust with with people in the space. Yeah. Because um the those things are required, I think. They&#39;re preconditions for success. But if you have some experience, like it doesn&#39;t need to be hard. Like you can just trade on the experience that you&#39;ve already gained thus far. And for Sasabi, I You know, if everything about Opkit was out of alignment with who I am and my background and my experience, my passion, with Sasabi, like m the first thing I wanted to do was to r align everything with who I am. And so I was like, I&#39;m gonna build a tool for people like me, um, based on my personal experience. Like it&#39;s gonna be an observability thing, it&#39;s gonna be a developer tool. I&#39;m gonna sell it to gr uh early and growth stage tech startups, which is like the only companies ever I&#39;ve ever worked at. Um and I&#39;m gonna name it after um Mobile Suit Gundam, which is a nineteen seventies, eighties era sci-fi anime, which I love. So I was like that this is a symbolic act about making Sasabi um in alignment with who I am. Yeah. And uh that&#39;s probably the most important thing that we most important m mistake I think we made with with Hopkins.\n\nHost: Yeah. Yeah. Talk about that maybe like uh the tail end of the Opkit journey and some of the lessons that you learned there and then what brought you back to starting another company um and deciding to work on this.\n\nSherwood: I guess to catch people up on Opkit, we were working for about two-ish years and we had built what&#39;s called a revenue cycle management software company where we were basically helping medical practices uh check patients&#39; insurance when they come in, um, keep that information on file, and then prepare and submit claims to insurance companies. We had built kind of a traditional SaaS tool for this. LLMs obviously happen in that time. And one one of the things we learned while working on Opkit is that there&#39;s a lot of operations that healthcare providers can only do over the phone with insurance companies. And that&#39;s we can maybe that&#39;s by design, maybe that&#39;s not. And so we had built a call center in the Philippines of people who are calling insurance companies to support our the rest of our product. And we started using LLMs to do quality assurance on those calls and to do data entry and data extraction from the call transcripts. And then we built an LLM voice voice agent. So I I think we were one of the first teams to actually build and commercialize an LLM based voice agent in healthcare. Um it was very early, it was very hard. Uh I think we really enjoyed the engineering challenge more than anything else, which probably points to to what we should have been doing. Yeah. And we did that pivot in our last or in our second year at Opkit. Um and so then our we had about a year worth of runway left to build and commercialize that solution, basically retool the company, reframe it, and then uh and go out and try to raise the seed extension to see if we can kind of keep things going. And got to the point where we had about six more months left of runway. We had prepared all of our materials, we had launched the products, uh went out to fundraise. Some of our early conversations were were not that exciting, um, kind of didn&#39;t seem like investors were super, super interested, and that led us to reconsider whether this was the right thing for us to be doing. So um our decision was that it was not and there&#39;s still plenty of time for us to go do something better. So we then started to seek out a acquirers and\n\nHost: Very cool. And yeah, talk about the decision to leave that and then start Sasabi again.\n\nSherwood: I mean 11X was a amazing and w and uh I&#39;m really proud of the product we built there and the team we our our team came in and did a lot of great engineering work there.\n\nBut uh first thing we did was rebuild their AI SDR product, their sales rep. And that was probably like a three to four month long project of building it from scratch, uh cutting over from the old platform to the new platform and and scaling it and kind of getting it to steady state. And in month like five, where most of that work had been done, we&#39;re now in sort of maintenance mode. And that&#39;s like, okay, well, I&#39;ve now set up data dog again. I&#39;ve set up all of the observability tools and CI CD tools that always set up.\n\nAnd because I&#39;m tech lead for this project, anytime something goes wrong, like I get a Slack message or someone like a a a go to market person comes and like taps on my shoulder. Um so now I&#39;m like the on call guy. And\n\nI found myself we had we&#39;re building a futuristic AI product using futuristic AI coding tools, and then I would go to debug it, and it was the same painful manual experience that I&#39;ve had for my entire career. Uh and so it was just it it it was painfully clear to me that uh we were going to do to uh observability what was already being done to uh like code generation or or or the the act of creating new code.\n\nUh and uh I also realized, wait a second, like this is like the perfect company for me. Right? Like it&#39;s it it&#39;s completely aligned with my interests, my experience, my combination of experience in in now AI and uh and infrastructure and dev tools and observability. And you know, I must I&#39;m I I&#39;ve already been a founder, so I kind of\n\nIt&#39;s n it wouldn&#39;t be a scary new thing. Like I know how to fundraise, I know how to build a team. Uh I know how to do a big launch. I know how to do press. Um so all of the I I felt like I had all of the right\n\ningredients to do this company and that this was like the company I was born to to build. Yeah.\n\nHost: Talk about anything that you specifically want to do differently with this company based on lessons that you learned from building Opkit.\n\nSherwood: Yeah, I mean the the big one was like build something I know, uh leverage my personal experience, pull play to my strengths, call it Sasabi because it should be uh it should be a representation of who I am. Um another one is that I thought it should be fun.\n\nI think as fun as Opkit was, like I I loved working with my co-founder, my best friends. I love going through YC. Uh healthcare was like intellectually rewarding and and interesting. And um there were a lot of new experiences which were which was which was great. I can&#39;t say that it was like fun. You know, like we were pushing that boulder. And the boulder never really they tell you that like the boulder you get over the hill and the boulder starts to roll. Like it never really rolled for us, and it was really hard. Um\n\nSo my decision to start Sasabi was like when I start this new company, it&#39;s gonna be fun. Um, and so I I\n\nI think that uh calling it uh something that I I love and and building a space that I love and working with uh frankly like customers and and other developers that I would be grabbing beers with anyways if I wasn&#39;t uh doing this if they weren&#39;t my customers. Yep. Uh was another uh thing another thing that I wanted to do to make it um feel like a uh like a better time. Yep.\n\nHost: Yep. Talk about your future vision for Sasabi. Where&#39;s it going five to ten years from now?\n\nSherwood: Well our our mission is to become the default observability tool for all companies uh in what we call the AI era, which I would say is um probably starts with the agentic like the year of agents in twenty twenty five and and forwards. Uh our vision is to create this world of uh self healing software, where software um uh improves uh itself without human uh intervention or direction. And uh I think\n\nOne thing that I that I remark on or reflect on is the fact like companies like Cursor are automating this part of the software development role, which is like creating new features and apps. And that&#39;s obviously like a big part of the job. And software engineering is like a trillion dollar industry globally. So right, like big opportunity. Cursor&#39;s a big company. But a much bigger part of my job as a developer is maintaining software that&#39;s already been written.\n\nAnd I think that is the opportunity for Sazabi. That&#39;s what we&#39;re focused on. So um I I think we definitely have a uh the chance to be like a really incredible and generational company um building what we&#39;re building.\n\nHost: Yeah, amazing. Talk about the decision to come back and and do YC again for a second time.\n\nSherwood: Yeah. This one is interesting. I feel like there&#39;s like a lot of reasons not to, right? It&#39;s like uh I&#39;ve already done YC, I&#39;m already part of the network, yeah, I&#39;ve already got access to book bookface. Um, you know, it&#39;s all my resume.\n\nWhich I feel like that&#39;s what a lot of people want. So it&#39;s a little counterintuitive. Um I guess from a business perspective, the first thing that comes to mind is that YC is an accelerator and uh we need to accelerate. Like Sasabi needs to accelerate. Uh our opportunity is here today, like we&#39;ll not be here forever. There are other companies that will try to do it, and uh I don&#39;t want to waste any time. Like it feels like very ephemeral to me. So I I want my team to move fast, I think YC will help us move faster. Um\n\nAnother thing is kind of um culturally, I w I I want like to establish a culture at Sasabi that is kind of based on some of the or is imbued with some of the YC values. Like YC will create like it creates a deadline for us very early. It has many there are many smaller deadlines along the way, so we just have to get used to this uh this cadence of shipping quickly and um YC also pushes you to get to market super fast, which I don&#39;t\n\nSherwood: Well we have a team of engineers, right? We&#39;re like eight engineers or something. So yeah, it&#39;s it would be very easy for us to just build forever and not commercialize. So I want that. Um and I I guess on a the the last note related to um f from a business perspective is good distribution and go to market. Um and this is like a little more tactical, but you know, every YC company is a software company, every software company has an observability solution. Sasabi should be that solution. Um I&#39;ll be following in a tradition of great YC companies like Brex and Deal and Rippling that have sold into uh their bash mates uh really successfully. Uh and I I think that Sasabi can do the same thing, so I want to use that as an opportunity. Yeah. Um then on a personal level. My first YC experience was uh was remote. Uh we were one of the COVID batches. So it&#39;s really different experience. I mean I&#39;m here in this space today that I&#39;ve actually I I&#39;ve never been in this building before. Uh which I think is like uh points to the fact that I have not had like the full experience. And uh it&#39;s been a dream for a long time. So I w I want I wanna uh I wanna stand on the stage at demo day and and And actually have the experience and and make real connections with my batchmates that happen here in person.\n\nHost: What&#39;s something you wish you knew at the beginning of this journey? Just which beginning are we talking about exiting it and starting a new one? And um maybe if there was something that uh you could go back and tell yourself at the beginning of uh the opkit journey, your first time going around during YC, what what is the advice you would give yourself?\n\nSherwood: I wouldn&#39;t want to give any advice that would actually change the outcome because I think I&#39;m building the the perfect company today. Um and I I think all of the years of like eating glass with Opkit, like that&#39;s like my Glenn Gl Glengarry, Glenn Ross period, right? Where I just like knocking on providers&#39; doors and they&#39;re like don&#39;t want to take my meeting and um we built a lot of grit and learned a lot about like how to build a startup under tough circumstances. Uh so I&#39;m really grateful for those lessons and would not give them away. Something that I might tell myself or maybe just remind myself is that startups are, you know, a lot of people perceive startups to be short and fast, but actually we are in a long-term game. It&#39;s like a long horizon game. And The lessons I learned from Opkit, the relationships I built uh with investors, with customers, with other engineers. Like I still keep up with my batchmates. Um, the, you know, I I I&#39;ve many of my batchmates are starting other companies that I could sell into or um that they c I could potentially recruit them. Like these are relationships that we we you build over a long period of time. And uh they compound. And so it&#39;s it&#39;s good to remember, remember that, be mindful of it. Uh Have integrity, be good to everyone you work with, because you never know. Like five years from now you might be asking them for money. Um so yeah, I would I think that&#39;s a good uh good tip, probably.\n\nHost: For anybody that&#39;s watching, talk about um hiring and the ideal engineers to come and work at Sasabi.\n\nSherwood: We are definitely hiring. Uh we&#39;re hiring in a lot of different roles. I would say that the Ideal candidates are uh they&#39;re high agency, they learn quickly, they they love tools. That doesn&#39;t need to be dev tools specifically, but just tools, like they kinda geek out on the the saw, so to speak, like the thing that makes you helps you do the thing. Former founders are great. People I mean former founders just like have to figure things out. They know what it&#39;s like to just do hard work, to um to put in long hours or to do things that are unsexy. Uh they&#39;re also very flexible. And I think right now with AI, we never we don&#39;t really know what our jobs are gonna look like or what the what the org structure and the different departments are gonna look like two years from now. So we&#39;ll we need people who are flexible and self-starters. Uh On a more practical level, like we&#39;re looking to basically hire software engineers in a lot of different roles. So um data and databases and infrastructure are hugely important to Sasabi. Like we build our own log ingestion and storage system. It&#39;s one of the things that sets us apart from a lot of other observability tools. And so uh we need to have best in class infrastructure and uh expertise at at the database level or the storage level. Um we need full stack product engineers, of course. Uh and we also need like front end and uh design engineers. So people who yeah, I like to say that we&#39;re building the linear of observability. Like it&#39;s gonna look and feel amazing, um, because you know, if you look at Datadog, it it does not feel that way. Um So I wanna I want to hire engineers who have who like appreciate aesthetics and design and um and attention to detail. And so that that&#39;s where the front end uh and design comes into play.\n\nHost: Amazing. Well, Sherwood, thank you so much for joining. Um super excited to work with you on Sasabi as well. Uh I think you are gonna build uh a massive generational company because you&#39;re building something that you know a lot about and that you&#39;re passionate about. And that you have deep insights in and I&#39;m so glad you came back home to the\n\nSherwood: thing. Yeah, thanks for finding me. Yeah, that you know,\n\nHost: you know, you know so well and really is the space and the idea and the business that you are the exact right person to be building.\n\nSherwood: Yeah, I hope that um I hope that other founders can kind of learn from my my story and and find whatever they&#39;re like uh I&#39;ve heard it referred to as a tombstone company. So I want other developer or other founders to find their tombstone company. Yeah. Um and to come do it here at YC.\n\nHost: Yeah, amazing. So thanks for joining.\n\nSherwood: Cool. Thank you.&quot;,&quot;slides&quot;:null,&quot;categories&quot;:[],&quot;categories_for_display&quot;:[],&quot;feature_score&quot;:0,&quot;youtube_id&quot;:&quot;UGYnC9zqa-k&quot;,&quot;youtube_view_count&quot;:3265,&quot;spotify_id&quot;:null,&quot;carousel_sort_order&quot;:null,&quot;created_at&quot;:&quot;2026-03-27T16:00:39.000Z&quot;,&quot;video_chapters&quot;:[[0,&quot;— Back to YC for a second time&quot;],[24,&quot;— The AI tool fixing production bugs&quot;],[96,&quot;— “Logs are all you need?”&quot;],[223,&quot;— Inside observability at Brex&quot;],[462,&quot;— Starting a healthcare startup&quot;],[741,&quot;— When the first startup unraveled&quot;],[1022,&quot;— The insight behind Sazabi&quot;],[1371,&quot;— Returning to YC&quot;],[1620,&quot;— Lessons for founders + hiring&quot;]],&quot;video_duration&quot;:1783,&quot;cover_photo&quot;:null,&quot;cover_photo_thumbnail&quot;:null,&quot;series_name&quot;:&quot;Founder Firesides&quot;,&quot;bookmarked&quot;:null,&quot;video_progress_seconds&quot;:null,&quot;title_in_thumbnail&quot;:false,&quot;view_access&quot;:&quot;all_founders&quot;},&quot;editUrl&quot;:null,&quot;relatedArticles&quot;:[{&quot;id&quot;:1344,&quot;slug&quot;:&quot;Lg-why-vertical-llm-agents-are-the-new-1-billion-saas-opportunities&quot;,&quot;title&quot;:&quot;Why Vertical LLM Agents Are The New $1 Billion SaaS Opportunities&quot;,&quot;youtube_id&quot;:&quot;eBVi_sLaYsc&quot;,&quot;spotify_id&quot;:null,&quot;author&quot;:&quot;Y Combinator&quot;,&quot;description&quot;:&quot;In this episode of the Lightcone, the hosts sit down with YC alum Jake Heller, the co-founder and CEO of Casetext
